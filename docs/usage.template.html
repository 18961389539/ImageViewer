<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ImageViewer 图像、ROI、分析和 3D/MPR 浏览使用手册。">
  <title>ImageViewer 使用手册</title>
  <style>
    :root {
      --ink: #152534;
      --muted: #5f7080;
      --paper: #f7f8f5;
      --surface: #ffffff;
      --line: #d8e0e4;
      --teal: #087d79;
      --teal-dark: #045d5b;
      --gold: #c78920;
      --soft-teal: #e4f2f0;
      --soft-gold: #fbf1d8;
      --code: #132431;
      --shadow: 0 14px 32px rgba(21, 37, 52, 0.08);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(8, 125, 121, 0.035) 1px, transparent 1px) 0 0 / 28px 28px,
        var(--paper);
      font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      line-height: 1.7;
    }

    a { color: var(--teal-dark); text-underline-offset: 0.18em; }

    code, kbd {
      font-family: Consolas, "Cascadia Code", monospace;
      font-size: 0.9em;
    }

    kbd {
      display: inline-block;
      min-width: 1.8em;
      padding: 0.08em 0.42em;
      color: var(--ink);
      background: #fff;
      border: 1px solid #b8c5cc;
      border-bottom-width: 2px;
      border-radius: 3px;
      text-align: center;
      white-space: nowrap;
    }

    .page-header {
      color: #f8ffff;
      background: var(--code);
      border-bottom: 4px solid var(--gold);
    }

    .header-inner, .layout {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }

    .header-inner { padding: 56px 0 46px; }

    .eyebrow {
      margin: 0 0 8px;
      color: #8ed8cf;
      font-size: 0.83rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1, h2, h3 { line-height: 1.25; }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.45rem);
      font-weight: 750;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 700px;
      margin: 14px 0 0;
      color: #c5d5dc;
      font-size: 1.05rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 228px minmax(0, 1fr);
      gap: 52px;
      align-items: start;
      padding: 38px 0 72px;
    }

    .toc {
      position: sticky;
      top: 24px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .toc strong {
      display: block;
      margin-bottom: 8px;
      font-size: 0.83rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .toc a {
      display: block;
      padding: 6px 8px;
      color: var(--muted);
      font-size: 0.93rem;
      text-decoration: none;
    }

    .toc a:hover, .toc a:focus-visible {
      color: var(--teal-dark);
      background: var(--soft-teal);
      outline: none;
    }

    main { min-width: 0; }

    section {
      scroll-margin-top: 24px;
      padding: 8px 0 36px;
      border-bottom: 1px solid var(--line);
    }

    section:last-child { border-bottom: 0; }

    h2 { margin: 0 0 14px; font-size: 1.62rem; }
    h3 { margin: 28px 0 10px; font-size: 1.14rem; }
    p { margin: 0 0 14px; }
    ol, ul { margin: 0 0 16px; padding-left: 1.45rem; }
    li + li { margin-top: 5px; }

    .meta {
      margin: 0 0 26px;
      padding: 13px 16px;
      color: var(--muted);
      background: var(--surface);
      border-left: 3px solid var(--gold);
      font-size: 0.94rem;
    }

    .lead {
      max-width: 780px;
      color: var(--muted);
      font-size: 1.06rem;
    }

    .step-list { counter-reset: step; list-style: none; padding: 0; }

    .step-list > li {
      position: relative;
      min-height: 40px;
      padding: 5px 0 6px 52px;
    }

    .step-list > li::before {
      position: absolute;
      top: 4px;
      left: 0;
      width: 31px;
      height: 31px;
      color: var(--teal-dark);
      background: var(--soft-teal);
      border: 1px solid #b3d8d3;
      border-radius: 50%;
      content: counter(step);
      counter-increment: step;
      font-weight: 700;
      line-height: 30px;
      text-align: center;
    }

    .table-scroll { max-width: 100%; overflow-x: auto; }
    .table-scroll:focus-visible { outline: 2px solid var(--teal); }
    .table-scroll table { min-width: 390px; }
    .table-scroll table.wide { min-width: 660px; }

    table {
      width: 100%;
      margin: 16px 0;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--line);
    }

    th, td { padding: 11px 13px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { background: #edf3f3; font-size: 0.92rem; }
    tr:last-child td { border-bottom: 0; }

    pre {
      overflow-x: auto;
      padding: 16px;
      color: #e4f5f3;
      background: var(--code);
      border-radius: 5px;
      line-height: 1.55;
    }

    .footer {
      padding: 24px 0 40px;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; gap: 22px; }
      .toc { position: static; display: flex; flex-wrap: wrap; gap: 3px; }
      .toc strong { width: 100%; }
      .toc a { padding: 5px 7px; }
    }

    @media (max-width: 520px) {
      .header-inner, .layout { width: min(100% - 28px, 1180px); }
      .header-inner { padding: 42px 0 35px; }
      th, td { padding: 9px; }
    }

    @media print {
      body { background: #fff; }
      .page-header { color: #152534; background: #fff; border-bottom: 2px solid #c78920; }
      .subtitle { color: #5f7080; }
      .layout { display: block; width: auto; padding: 20px 34px; }
      .toc { display: none; }
      .table-scroll { overflow: visible; }
      .table-scroll table, .table-scroll table.wide { min-width: 0; }
      table { overflow-wrap: anywhere; }
      tr { break-inside: avoid; }
      h2, h3 { break-after: avoid; }
      pre { white-space: pre-wrap; }
      a { color: inherit; text-decoration: none; }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="header-inner">
      <p class="eyebrow">ImageViewer / User Guide</p>
      <h1>ImageViewer 使用手册</h1>
      <p class="subtitle">从第一次标定和导出开始，逐步掌握图像浏览、ROI 测量、体数据与项目交付。</p>
    </div>
  </header>

  <div class="layout">
    <nav class="toc" aria-label="手册目录">
      <strong>目录</strong>
<!--{{TOC}}-->
    </nav>

    <main>
<!--{{CONTENT}}-->
    </main>
  </div>

  <footer class="footer">ImageViewer 使用手册 · 可离线打开与打印</footer>
</body>
</html>
