<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ImageViewer 图像、ROI、分析和 3D/MPR 浏览使用手册。">
  <meta name="color-scheme" content="light dark">
  <title>ImageViewer 使用手册</title>
  <style>
    :root {
      color-scheme: light dark;
      --ink: #16262f;
      --ink-soft: #2f414c;
      --muted: #5c6f7b;
      --paper: #f6f8f7;
      --surface: #ffffff;
      --surface-sunken: #f1f5f4;
      --th-bg: #e9f1ef;
      --zebra: rgba(11, 122, 116, 0.055);
      --meta-ink: #4f6572;
      --line: #dbe3e6;
      --line-strong: #c3d0d6;
      --teal: #0b7a74;
      --teal-dark: #055c58;
      --link: #055c58;
      --gold: #c1861d;
      --soft-teal: #e6f3f1;
      --soft-gold: #fbf2dd;
      --code: #101e27;
      --code-ink: #dff0ee;
      --shadow: 0 18px 40px rgba(16, 33, 43, 0.09);
      --radius: 10px;
    }

    /* 跟随系统，但手动选过浅色时以手动为准 */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --ink: #dbe7ed;
        --ink-soft: #bccfd8;
        --muted: #8ba1ad;
        --paper: #0d161c;
        --surface: #14212a;
        --surface-sunken: #111c23;
        --th-bg: #1e2f39;
        --zebra: rgba(255, 255, 255, 0.055);
        --meta-ink: #9db3bf;
        --line: #24343d;
        --line-strong: #33474f;
        --teal: #4fbdb4;
        --teal-dark: #6fd0c7;
        --link: #6fd0c7;
        --gold: #d9a441;
        --soft-teal: rgba(79, 189, 180, 0.14);
        --soft-gold: rgba(217, 164, 65, 0.14);
        --code: #081117;
        --code-ink: #d7e9e6;
        --shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      }
    }

    :root[data-theme="dark"] {
        --ink: #dbe7ed;
        --ink-soft: #bccfd8;
        --muted: #8ba1ad;
        --paper: #0d161c;
        --surface: #14212a;
        --surface-sunken: #111c23;
        --th-bg: #1e2f39;
        --zebra: rgba(255, 255, 255, 0.055);
        --meta-ink: #9db3bf;
        --line: #24343d;
        --line-strong: #33474f;
        --teal: #4fbdb4;
        --teal-dark: #6fd0c7;
        --link: #6fd0c7;
        --gold: #d9a441;
        --soft-teal: rgba(79, 189, 180, 0.14);
        --soft-gold: rgba(217, 164, 65, 0.14);
        --code: #081117;
        --code-ink: #d7e9e6;
        --shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    html {
      font-size: calc(16px * var(--scale, 1));
      scroll-behavior: smooth;
      scroll-padding-top: 20px;
      -webkit-text-size-adjust: 100%;
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }

    body {
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image:
        linear-gradient(90deg, rgba(11, 122, 116, 0.045) 1px, transparent 1px) 0 0 / 26px 26px;
      font-family: "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", sans-serif;
      font-size: 1rem;
      line-height: 1.75;
      text-rendering: optimizeLegibility;
    }

    @media (prefers-color-scheme: dark) {
      body { background-image: none; }
    }

    ::selection { background: rgba(11, 122, 116, 0.22); }

    a {
      color: var(--link);
      text-decoration-color: color-mix(in srgb, var(--link) 40%, transparent);
      text-underline-offset: 0.18em;
    }

    a:hover { text-decoration-color: var(--link); }

    :focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 2px;
      border-radius: 3px;
    }

    .skip-link {
      position: absolute;
      top: -100px;
      left: 16px;
      z-index: 20;
      padding: 10px 16px;
      color: #fff;
      background: var(--teal-dark);
      border-radius: 0 0 6px 6px;
      text-decoration: none;
      transition: top 0.15s ease-in-out;
    }

    .skip-link:focus { top: 0; }

    code, kbd, pre {
      font-family: Consolas, "Cascadia Mono", "Cascadia Code", ui-monospace, monospace;
    }

    code {
      padding: 0.06em 0.34em;
      color: var(--ink-soft);
      background: color-mix(in srgb, var(--teal) 9%, transparent);
      border: 1px solid color-mix(in srgb, var(--teal) 16%, transparent);
      border-radius: 4px;
      font-size: 0.88em;
      white-space: nowrap;
    }

    kbd {
      display: inline-block;
      min-width: 1.7em;
      margin: 0 0.06em;
      padding: 0.1em 0.42em;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-bottom-width: 2px;
      border-radius: 4px;
      box-shadow: 0 1px 0 rgba(16, 33, 43, 0.06);
      font-size: 0.82em;
      line-height: 1.6;
      text-align: center;
      white-space: nowrap;
    }

    .page-header {
      position: relative;
      color: #f6fdfd;
      background:
        radial-gradient(1200px 240px at 12% -40%, rgba(79, 189, 180, 0.28), transparent 70%),
        linear-gradient(180deg, #12222b, #0e1b23 62%, #0d1920);
      border-bottom: 3px solid var(--gold);
    }

    .header-inner, .layout {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }

    .header-inner { padding: 52px 0 42px; }

    .eyebrow {
      margin: 0 0 10px;
      color: #85d5cc;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1, h2, h3 { line-height: 1.28; text-wrap: balance; }

    h1 {
      max-width: 780px;
      margin: 0;
      font-size: clamp(2rem, 3.6vw, 3.05rem);
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .subtitle {
      max-width: 660px;
      margin: 14px 0 0;
      color: #b9cdd6;
      font-size: 1.02rem;
    }

    .resume-link:not([hidden]) {
      display: inline-block;
      margin: 12px 8px 0 0;
      padding: 7px 12px;
      color: #c6f2ed;
      border: 1px solid #5c888c;
      border-radius: 7px;
      font-size: 0.9rem;
    }

    .resume-link:hover { background: #253c44; }

    .layout {
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr);
      gap: 48px;
      align-items: start;
      padding: 36px 0 64px;
    }

    .toc {
      position: sticky;
      top: 18px;
      max-height: calc(100vh - 36px);
      padding: 14px 12px;
      overflow: auto;
      background: color-mix(in srgb, var(--surface) 86%, transparent);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 1px 0 rgba(16, 33, 43, 0.03);
      backdrop-filter: blur(6px);
      scrollbar-width: thin;
    }

    .toc-title {
      margin: 2px 0 10px;
      padding-left: 8px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .toc-toggle { display: none; }

    @media screen {
      .toc-chapters {
        max-height: calc(100vh - 172px);
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
      }
    }

    .toc a {
      display: flex;
      gap: 8px;
      align-items: baseline;
      padding: 6px 8px;
      color: var(--muted);
      border-left: 2px solid transparent;
      border-radius: 0 5px 5px 0;
      font-size: 0.9rem;
      text-decoration: none;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .toc a:hover, .toc a:focus-visible {
      color: var(--teal-dark);
      background: var(--soft-teal);
      outline: none;
    }

    .toc a[aria-current="true"] {
      color: var(--teal-dark);
      background: var(--soft-teal);
      border-left-color: var(--gold);
      font-weight: 600;
    }

    .toc-num {
      flex: none;
      color: var(--muted);
      font-size: 0.72rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      opacity: 0.75;
    }

    .toc a[aria-current="true"] .toc-num { color: var(--teal-dark); opacity: 1; }

    /* 桌面目录默认收起小节；指针、键盘焦点或当前章均可展开。 */
    .toc-sub {
      display: none;
      margin: 0 0 6px;
      padding: 0;
      list-style: none;
    }

    .toc-group:hover .toc-sub,
    .toc-group:focus-within .toc-sub,
    .toc-group:has(a[aria-current="true"]) .toc-sub { display: block; }

    .toc-sub a {
      padding: 3px 8px 3px 34px;
      color: var(--muted);
      border-left: 2px solid transparent;
      font-size: 0.84rem;
      line-height: 1.5;
    }

    .toc-sub a:hover, .toc-sub a:focus-visible {
      color: var(--teal-dark);
      background: var(--soft-teal);
    }

    main { min-width: 0; }

    section {
      padding: 4px 0 38px;
      border-bottom: 1px solid var(--line);
    }

    section + section { padding-top: 34px; }

    section:last-child { border-bottom: 0; }

    h2 {
      position: relative;
      margin: 0 0 16px;
      padding-left: 14px;
      font-size: 1.52rem;
      font-weight: 700;
      letter-spacing: -0.005em;
    }

    h2::before {
      position: absolute;
      top: 0.16em;
      bottom: 0.16em;
      left: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--teal), color-mix(in srgb, var(--teal) 30%, transparent));
      border-radius: 2px;
      content: "";
    }

    h3 {
      margin: 30px 0 10px;
      padding-bottom: 6px;
      color: var(--ink);
      border-bottom: 1px dashed var(--line);
      font-size: 1.08rem;
      font-weight: 650;
    }

    .anchor {
      position: absolute;
      left: -0.72em;
      padding: 0 0.16em;
      color: var(--muted);
      font-weight: 400;
      text-decoration: none;
      opacity: 0;
      transition: opacity 0.12s ease;
    }

    h2:hover .anchor, .anchor:focus-visible { opacity: 1; }

    .copy-link {
      display: inline-block;
      margin-inline-start: 0.6em;
      padding: 2px 6px;
      color: var(--teal-dark);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 5px;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 500;
      line-height: 1.6;
      vertical-align: middle;
      cursor: pointer;
    }

    .copy-link:hover { background: var(--soft-teal); }

    .copy-dialog {
      width: min(calc(100% - 28px), 34rem);
      padding: 20px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .copy-dialog::backdrop { background: rgba(0, 0, 0, 0.46); }
    .copy-dialog label { display: block; font-weight: 650; }
    .copy-dialog input {
      width: 100%;
      margin: 8px 0 12px;
      padding: 7px;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      font: inherit;
    }
    .copy-dialog p { color: var(--muted); font-size: 0.88rem; }
    .copy-dialog button {
      padding: 5px 12px;
      color: var(--teal-dark);
      background: var(--soft-teal);
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      font: inherit;
      cursor: pointer;
    }

    p, ul, ol { max-width: 74ch; }

    p { margin: 0 0 14px; }

    ol, ul { margin: 0 0 16px; padding-left: 1.45rem; }

    li + li { margin-top: 5px; }

    li::marker { color: var(--muted); }

    li > code { white-space: nowrap; }

    .meta {
      display: grid;
      gap: 4px;
      margin: 0 0 28px;
      padding: 14px 18px;
      color: var(--meta-ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 3px solid var(--gold);
      border-radius: 0 var(--radius) var(--radius) 0;
      font-size: 0.92rem;
      line-height: 1.65;
    }

    .meta-line { display: block; }

    .meta code { background: color-mix(in srgb, var(--teal) 7%, transparent); }

    .step-list { counter-reset: step; max-width: 74ch; padding: 0; list-style: none; }

    .step-list > li {
      position: relative;
      min-height: 40px;
      padding: 4px 0 8px 50px;
    }

    .step-list > li + li { margin-top: 4px; }

    .step-list > li::before {
      position: absolute;
      top: 3px;
      left: 0;
      width: 30px;
      height: 30px;
      color: var(--teal-dark);
      background: var(--soft-teal);
      border: 1px solid color-mix(in srgb, var(--teal) 30%, transparent);
      border-radius: 50%;
      content: counter(step);
      counter-increment: step;
      font-size: 0.86rem;
      font-weight: 700;
      line-height: 29px;
      text-align: center;
    }

    .table-scroll {
      max-width: 100%;
      margin: 18px 0 20px;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      scrollbar-width: thin;
    }

    .table-scroll:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.94rem;
      line-height: 1.62;
      font-variant-numeric: tabular-nums;
    }

    .table-scroll table { min-width: 420px; }
    .table-scroll table.wide { min-width: 700px; }

    /* 按列数分配首列宽度：两列表是"名称 / 说明"，三列表是"分类 / 命令 / 说明"。
       Chinese: 用 :has 判断列数，避免在 Markdown 里写宽度；四列及以上保持自动分配。 */
    table:has(> thead > tr > th:nth-child(2):last-child) > thead th:nth-child(1) { width: 26%; }
    table:has(> thead > tr > th:nth-child(3):last-child) > thead th:nth-child(1) { width: 20%; }
    table:has(> thead > tr > th:nth-child(3):last-child) > thead th:nth-child(2) { width: 34%; }

    /* 只有真正溢出时才在右侧做渐隐，提示还能横向滑；滚到末尾撤掉，避免内容被永久冲淡。 */
    .table-scroll.is-scrollable:not(.is-at-end) {
      mask-image: linear-gradient(90deg, #000 calc(100% - 26px), transparent);
    }

    .chapter-index {
      margin: 34px 0 0;
      padding: 18px 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .chapter-index-title {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .chapter-index ol {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 3px 28px;
      margin: 0;
      padding-left: 0;
      max-width: none;
      counter-reset: chapter;
      list-style: none;
      font-size: 0.93rem;
    }

    .chapter-index li {
      display: flex;
      gap: 7px;
      align-items: baseline;
      counter-increment: chapter;
    }

    .chapter-index li::before {
      flex: none;
      min-width: 1.7em;
      color: var(--muted);
      content: counter(chapter, decimal-leading-zero);
      font-size: 0.76rem;
      font-variant-numeric: tabular-nums;
      opacity: 0.8;
    }

    .chapter-index a { text-decoration: none; }

    .chapter-index a:hover { text-decoration: underline; }

    th, td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      position: relative;
      color: var(--ink);
      background: var(--th-bg);
      border-bottom: 1px solid var(--line-strong);
      font-size: 0.86rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    th code {
      background: var(--surface);
      border-color: var(--line-strong);
      font-weight: 600;
    }

    tbody tr:nth-child(even) { background: var(--zebra); }

    tbody tr:hover { background: var(--soft-teal); }

    tbody tr:last-child td { border-bottom: 0; }

    td:first-child { color: var(--ink); }

    td code { white-space: nowrap; }

    figure {
      margin: 20px 0 22px;
    }

    /* 原尺寸显示、超宽才缩：小图（面板、状态栏）不该被放大成马赛克。 */
    figure img {
      display: block;
      width: auto;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    figcaption {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.55;
    }

    pre {
      position: relative;
      margin: 18px 0 20px;
      padding: 34px 18px 16px;
      overflow-x: auto;
      color: var(--code-ink);
      background: var(--code);
      border-radius: var(--radius);
      line-height: 1.6;
      tab-size: 4;
    }

    pre[data-lang]::before {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      padding: 7px 16px;
      color: #8fb3ae;
      background: rgba(255, 255, 255, 0.055);
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      content: attr(data-lang);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    pre code {
      padding: 0;
      color: inherit;
      background: none;
      border: 0;
      font-size: 0.9rem;
      white-space: pre;
    }

    .toc-search { margin-bottom: 10px; }

    .toc-search input {
      width: 100%;
      padding: 7px 10px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      font: inherit;
      font-size: 0.88rem;
    }

    .toc-search input::placeholder { color: var(--muted); }

    .toc-search input:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }

    .search-status {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media screen {
      .toc.is-searching .toc-title,
      .toc.is-searching .toc-chapters,
      .toc.is-searching .toc-toggle,
      .toc.is-searching .toc-nav { display: none; }

      #toc-results:not([hidden]) {
        display: grid;
        gap: 2px;
        max-height: min(55vh, 32rem);
        overflow-y: auto;
        overflow-wrap: anywhere;
        overscroll-behavior: contain;
      }
    }

    #toc-results a {
      display: block;
      padding: 7px 8px;
      border-left: 0;
      border-radius: 6px;
      text-decoration: none;
    }

    #toc-results a:hover { background: var(--soft-teal); }

    .toc-result-chapter {
      display: block;
      color: var(--teal-dark);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
    }

    .toc-result-text {
      display: block;
      margin-top: 2px;
      color: var(--ink-soft);
      font-size: 0.84rem;
      line-height: 1.5;
    }

    #toc-results mark {
      padding: 0 0.12em;
      color: inherit;
      background: color-mix(in srgb, var(--gold) 34%, transparent);
      border-radius: 2px;
      box-shadow: inset 0 -0.3em 0 color-mix(in srgb, var(--gold) 20%, transparent);
    }

    .toc-empty { margin: 6px 8px; color: var(--muted); font-size: 0.85rem; }

    .toc-nav {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .toc-nav a {
      padding: 4px 6px;
      color: var(--muted);
      border-left: 0;
      border-radius: 5px;
      font-size: 0.82rem;
      text-decoration: none;
    }

    .toc-nav a:hover { color: var(--teal-dark); background: var(--soft-teal); }

    .toc-nav a[aria-disabled="true"] { opacity: 0.4; pointer-events: none; }

    .reader-tools {
      position: fixed;
      right: 22px;
      bottom: 74px;
      z-index: 10;
      display: grid;
      gap: 6px;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      box-shadow: var(--shadow);
    }

    .reader-tools button {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      padding: 0;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-radius: 50%;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .reader-tools button:hover { color: var(--teal-dark); background: var(--soft-teal); }

    .to-top {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 14px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      box-shadow: var(--shadow);
      font-size: 0.85rem;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .to-top.is-visible { visibility: visible; opacity: 1; pointer-events: auto; transform: none; }

    .to-top:hover { border-color: var(--teal); color: var(--teal-dark); }

    @media (prefers-color-scheme: dark) {
      pre { border: 1px solid rgba(255, 255, 255, 0.07); }
    }

    .footer {
      padding: 26px 0 44px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      font-size: 0.86rem;
      text-align: center;
    }

    @media screen and (max-width: 900px) {
      .layout { grid-template-columns: minmax(0, 1fr); gap: 20px; padding-top: 22px; }
      .toc {
        position: static;
        max-height: none;
        padding: 10px;
        overflow: visible;
      }
      .toc-toggle:not([hidden]) {
        display: block;
        min-height: 42px;
        padding: 7px 10px;
        color: var(--teal-dark);
        background: var(--surface);
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        font: inherit;
        cursor: pointer;
      }
      .toc-toggle:not([hidden])[aria-expanded="false"] ~ .toc-title,
      .toc-toggle:not([hidden])[aria-expanded="false"] ~ .toc-chapters,
      .toc-nav { display: none; }
      .toc-title { margin-top: 12px; }
      .toc-chapters { max-height: min(52vh, 26rem); }
      .toc-sub { display: block; }
      .toc-sub a, #toc-results a { padding-top: 8px; padding-bottom: 8px; }
      .toc-search input { font-size: max(16px, 0.88rem); }
      .copy-link { min-height: 32px; }
      .reader-tools {
        position: static;
        display: inline-flex;
        gap: 3px;
        margin-top: 12px;
        padding: 3px;
        box-shadow: none;
      }
      .reader-tools button { width: 38px; height: 38px; }
      section + section { padding-top: 28px; }
      p, ul, ol, .step-list { max-width: none; }
      .chapter-index ol { grid-template-columns: 1fr; }
    }

    @media screen and (max-width: 560px) {
      .header-inner, .layout { width: 100%; padding-right: 14px; padding-left: 14px; }
      .header-inner { padding-top: 36px; padding-bottom: 28px; }
      h1 { font-size: 1.72rem; overflow-wrap: anywhere; }
      h2 { font-size: 1.3rem; }
      main { overflow-wrap: anywhere; }
      main :not(pre, td, th) > code { white-space: normal; }
      th, td { padding: 9px 10px; }
      /* 390 宽的屏幕上再保留 420px 最小宽度就会把整页撑出横向滚动 */
      .table-scroll table, .table-scroll table.wide { min-width: 0; }
      .to-top { right: 14px; bottom: 14px; }
    }

    @media print {
      /* 打印必须强制浅色：系统处于暗色模式时，深色变量会一路带进纸张，
         表头会变成深底黑字。这里把屏幕用的每个颜色变量都重置一遍。 */
      :root[data-theme], :root:not([data-theme]) {
        --ink: #16262f;
        --ink-soft: #2f414c;
        --muted: #5c6f7b;
        --meta-ink: #4f6572;
        --paper: #fff;
        --surface: #fff;
        --surface-sunken: #f5f7f6;
        --th-bg: #edf3f1;
        --zebra: #f7faf9;
        --line: #d3dade;
        --line-strong: #b9c7ce;
        --link: #055c58;
        --teal: #0b7a74;
        --teal-dark: #055c58;
        --soft-teal: #eef7f5;
        --soft-gold: #fbf2dd;
        --code-ink: #16262f;
      }
      html { font-size: 16px; color-scheme: light; }
      @page { size: A4; margin: 14mm 12mm; }
      body { background: #fff; font-size: 10.5pt; }
      .page-header { color: #16262f; background: #fff; border-bottom: 2px solid var(--gold); }
      .eyebrow { color: var(--teal-dark); }
      .subtitle { color: var(--muted); }
      .header-inner { padding: 0 0 14px; }
      .layout { display: block; width: auto; padding: 14px 0 0; }
      .skip-link, .to-top, .reader-tools, .toc-search, .toc-toggle, .search-status { display: none; }
      .resume-link:not([hidden]), .copy-link, .copy-dialog { display: none; }
      .toc-nav, #toc-results { display: none; }
      /* 打印件也要目录：独立一页，排在正文之前 */
      .toc {
        position: static;
        display: block;
        max-height: none;
        padding: 0;
        overflow: visible;
        background: none;
        border: 0;
        box-shadow: none;
        column-count: 2;
        column-gap: 24px;
        line-height: 1.24;
        break-after: page;
      }
      .toc-group { break-inside: avoid; }
      .toc-chapters { display: contents; }
      .toc a {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 2px 0;
        color: #16262f;
        border: 0;
      }
      .toc-sub { display: block; margin: 0 0 4px; }
      .toc-sub a { padding: 1px 0 1px 40px; color: #5c6f7b; font-size: 9.5pt; }
      figure { break-inside: avoid; margin: 10px 0; }
      .toc a[aria-current="true"] { background: none; font-weight: 600; }
      .toc-title { column-span: all; margin: 0 0 10px; color: #5c6f7b; font-size: 0.78rem; }
      .toc-num { display: inline; flex: none; min-width: 2em; color: #5c6f7b; }
      .toc a { border-bottom: 0; }
      h1 { font-size: 22pt; }
      .subtitle { margin-top: 8px; font-size: 10pt; }
      p, ul, ol, .step-list { max-width: none; }
      /* 纸质件已有完整目录，正文末尾的卡片只是屏幕导航，打印时去掉 */
      .chapter-index, .footer { display: none; }
      section { padding-bottom: 16px; }
      section + section { padding-top: 18px; }
      #appendix-print { padding-bottom: 8px; }
      #integration { padding-top: 8px; padding-bottom: 0; }
      #integration h2 { margin-bottom: 6px; }
      .table-scroll { overflow: visible; border-radius: 0; }
      .table-scroll.is-scrollable:not(.is-at-end) { mask-image: none; }
      .table-scroll table, .table-scroll table.wide { min-width: 0; }
      table { font-size: 9pt; overflow-wrap: anywhere; }
      thead { display: table-header-group; }
      tr, pre { break-inside: avoid; }
      h2, h3 { break-after: avoid; }
      pre { white-space: pre-wrap; background: #f5f7f6; color: #16262f; border: 1px solid var(--line); }
      pre[data-lang]::before { display: none; }
      pre code { color: inherit; white-space: pre-wrap; }
      a { color: inherit; text-decoration: none; }
      .anchor { display: none; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>

  <header class="page-header">
    <div class="header-inner">
      <p class="eyebrow">ImageViewer / User Guide</p>
      <h1>ImageViewer 使用手册</h1>
      <p class="subtitle">从第一次标定和导出开始，逐步掌握图像浏览、ROI 测量、体数据与项目交付。</p>
      <a class="resume-link" id="resume-reading" href="#" hidden></a>
      <div class="reader-tools" role="group" aria-label="阅读设置">
        <button type="button" data-action="font-smaller" aria-label="缩小字号">A−</button>
        <button type="button" data-action="font-larger" aria-label="放大字号">A+</button>
        <button type="button" data-action="toggle-theme" aria-label="切换深浅色">☾</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <nav class="toc" id="manual-toc" aria-label="手册目录与搜索" tabindex="-1">
      <div class="toc-search" hidden>
        <input id="toc-search" type="search" placeholder="搜索手册…" aria-label="搜索手册" aria-controls="toc-results" autocomplete="off">
      </div>
      <button type="button" class="toc-toggle" aria-controls="toc-chapters" aria-expanded="false" hidden>展开目录</button>
      <p class="toc-title">目录</p>
      <div class="toc-chapters" id="toc-chapters">
<!--{{TOC}}-->
      </div>
      <p class="search-status" role="status"></p>
      <div id="toc-results" hidden></div>
      <div class="toc-nav">
        <a id="toc-prev" href="#">‹ 上一章</a>
        <a id="toc-next" href="#">下一章 ›</a>
      </div>
    </nav>

    <main id="main">
<!--{{CONTENT}}-->
    </main>
  </div>

  <a class="to-top" href="#main" aria-label="回到顶部">回到顶部</a>

  <p class="search-status" id="copy-status" role="status"></p>
  <dialog class="copy-dialog" id="copy-dialog" aria-labelledby="copy-link-label">
    <form method="dialog">
      <label for="copy-url" id="copy-link-label">手动复制本节链接</label>
      <input type="text" id="copy-url" readonly autofocus>
      <p id="copy-local-note" hidden>这是本机文件地址；其他读者需要能访问同一份手册。</p>
      <button type="submit">关闭</button>
    </form>
  </dialog>

  <footer class="footer">ImageViewer 使用手册 · 由 docs/usage.md 生成 · 可离线打开与打印</footer>

  <script>
    (function () {
      var root = document.documentElement;
      var toc = document.getElementById('manual-toc');
      var chapterList = document.getElementById('toc-chapters');
      var tocToggle = toc.querySelector('.toc-toggle');
      var narrow = window.matchMedia('(max-width: 900px)');
      var links = Array.prototype.slice.call(chapterList.querySelectorAll('a[href^="#"]'));
      var byId = {};
      links.forEach(function (link) { byId[link.getAttribute('href').slice(1)] = link; });
      var sections = Array.prototype.slice.call(document.querySelectorAll('main > section[id]'));

      function showDirectory(open) {
        tocToggle.setAttribute('aria-expanded', String(open));
        tocToggle.textContent = open ? '收起目录' : '展开目录';
      }
      tocToggle.hidden = false;
      tocToggle.addEventListener('click', function () {
        showDirectory(tocToggle.getAttribute('aria-expanded') !== 'true');
      });

      // ---- 阅读设置：字号与深浅色（存 localStorage，file:// 下可能被禁用，故都包了 try） ----
      function readStore(key) {
        try { return window.localStorage.getItem(key); } catch (error) { return null; }
      }
      function writeStore(key, value) {
        try { window.localStorage.setItem(key, value); } catch (error) { /* 忽略 */ }
      }

      var scale = parseFloat(readStore('iv-scale') || '1');
      if (isNaN(scale)) { scale = 1; }
      function applyScale(value) {
        scale = Math.min(1.3, Math.max(0.85, Math.round(value * 100) / 100));
        root.style.setProperty('--scale', String(scale));
        writeStore('iv-scale', String(scale));
      }
      applyScale(scale);

      Array.prototype.forEach.call(document.querySelectorAll('[data-action="font-smaller"]'), function (button) {
        button.addEventListener('click', function () { applyScale(scale - 0.05); });
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-action="font-larger"]'), function (button) {
        button.addEventListener('click', function () { applyScale(scale + 0.05); });
      });

      var themeButton = document.querySelector('[data-action="toggle-theme"]');
      var storedTheme = readStore('iv-theme');
      if (storedTheme === 'dark' || storedTheme === 'light') {
        root.setAttribute('data-theme', storedTheme);
      }
      function effectiveDark() {
        var attr = root.getAttribute('data-theme');
        if (attr === 'dark') { return true; }
        if (attr === 'light') { return false; }
        return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      }
      function syncThemeButton() {
        if (!themeButton) { return; }
        var dark = effectiveDark();
        themeButton.textContent = dark ? '☀' : '☾';
        themeButton.setAttribute('aria-label', dark ? '切换到浅色' : '切换到深色');
      }
      syncThemeButton();
      if (themeButton) {
        themeButton.addEventListener('click', function () {
          var next = effectiveDark() ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          writeStore('iv-theme', next);
          syncThemeButton();
        });
      }

      // ---- 目录高亮与上一章/下一章 ----
      var current = null;
      var currentIndex = -1;

      function setChapterLink(link, section) {
        if (section) {
          link.setAttribute('href', '#' + section.id);
          link.removeAttribute('aria-disabled');
        } else {
          link.removeAttribute('href');
          link.setAttribute('aria-disabled', 'true');
        }
      }

      function updateChapterNav() {
        var prev = document.getElementById('toc-prev');
        var next = document.getElementById('toc-next');
        if (!prev || !next) { return; }
        setChapterLink(prev, sections[currentIndex - 1]);
        setChapterLink(next, sections[currentIndex + 1]);
      }

      function setCurrent(id) {
        if (!id || id === current) { return; }
        var index = -1;
        for (var i = 0; i < sections.length; i++) {
          if (sections[i].id === id) { index = i; break; }
        }
        if (index < 0) { return; }
        current = id;
        currentIndex = index;
        links.forEach(function (link) { link.removeAttribute('aria-current'); });
        var active = byId[id];
        if (active) {
          active.setAttribute('aria-current', 'true');
          // 只滚动桌面的目录列表，不能把窄屏上的正文拉回页首。
          if (!narrow.matches && !toc.classList.contains('is-searching') && !toc.contains(document.activeElement)) {
            var item = active.getBoundingClientRect();
            var list = chapterList.getBoundingClientRect();
            if (item.top < list.top) { chapterList.scrollTop += item.top - list.top; }
            if (item.bottom > list.bottom) { chapterList.scrollTop += item.bottom - list.bottom; }
          }
        }
        updateChapterNav();
      }

      if ('IntersectionObserver' in window && sections.length) {
        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) { setCurrent(entry.target.id); }
          });
        }, { rootMargin: '-84px 0px -68% 0px', threshold: 0 });
        sections.forEach(function (section) { observer.observe(section); });
      }

      function syncChapterFromHash() {
        var target = document.getElementById(window.location.hash.slice(1));
        var section = target && target.closest('main > section[id]');
        if (section) { setCurrent(section.id); }
      }
      setCurrent(sections[0] && sections[0].id);
      syncChapterFromHash();
      window.addEventListener('hashchange', syncChapterFromHash);

      function jumpTo(id) {
        var target = document.getElementById(id);
        if (!target) { return; }
        if (window.location.hash === '#' + id) {
          target.scrollIntoView();
        } else {
          window.location.hash = id;
        }
        var heading = target.matches('section') ? target.querySelector('h2') : target;
        if (heading) {
          heading.setAttribute('tabindex', '-1');
          heading.focus({ preventScroll: true });
        }
        rememberReading(id);
      }

      function followJump(event, link, beforeJump) {
        if (event.defaultPrevented || event.button !== 0 ||
            event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) { return; }
        event.preventDefault();
        if (beforeJump) { beforeJump(); }
        jumpTo(link.getAttribute('href').slice(1));
      }

      links.forEach(function (link) {
        link.addEventListener('click', function (event) {
          followJump(event, link, function () {
            if (narrow.matches) { showDirectory(false); }
          });
        });
      });

      // ---- 站内搜索：按最接近的小节分组，优先匹配标题 ----
      var searchInput = document.getElementById('toc-search');
      var results = document.getElementById('toc-results');
      var searchStatus = toc.querySelector('.search-status');
      var searchIndex = [];
      var readingHeadings = [];
      var readingById = Object.create(null);

      function cleanText(text) { return text.replace(/\s+/g, ' ').trim(); }

      sections.forEach(function (section) {
        var chapter = section.querySelector('h2');
        var anchor = chapter && chapter.querySelector('.anchor');
        var chapterTitle = chapter ? cleanText(chapter.textContent.slice(anchor ? anchor.textContent.length : 0)) : section.id;
        var id = section.id;
        var title = chapterTitle;
        Array.prototype.forEach.call(section.querySelectorAll('h2, h3[id], p, li, td, th, figcaption, pre'), function (node) {
          var text = node === chapter ? chapterTitle : cleanText(node.textContent);
          if (node.matches('h3[id]')) {
            id = node.id;
            title = chapterTitle + ' › ' + text;
          }
          if (text) {
            var isHeading = node.matches('h2, h3');
            searchIndex.push({
              id: id, title: title, text: text, normalized: text.toLowerCase(), heading: isHeading
            });
            if (isHeading) {
              var heading = { id: id, title: text, node: node };
              readingHeadings.push(heading);
              readingById[id] = heading;
            }
          }
        });
      });

      // ---- 本机阅读位置：仅显示返回入口，直接打开带锚点的地址仍走浏览器的跳转 ----
      var resumeLink = document.getElementById('resume-reading');
      var readingKey = 'iv-manual-reading-anchor-v1';
      var readingId = readStore(readingKey);
      var printing = window.matchMedia('print');
      var readingTimer = null;

      function updateResumeLink() {
        var heading = readingById[readingId];
        resumeLink.hidden = !heading;
        if (!heading) { return; }
        resumeLink.href = '#' + heading.id;
        resumeLink.textContent = '继续阅读 · ' + heading.title;
      }

      function rememberReading(id) {
        if (printing.matches || id === readingId || !readingById[id]) { return; }
        readingId = id;
        writeStore(readingKey, id);
        updateResumeLink();
      }

      function recordVisibleHeading() {
        if (printing.matches || !readingHeadings.length ||
            readingHeadings[0].node.getBoundingClientRect().top > 0) { return; }
        var readingLine = Math.min(108, window.innerHeight / 4);
        for (var i = readingHeadings.length - 1; i >= 0; i--) {
          var entry = readingHeadings[i];
          var top = entry.node.getBoundingClientRect().top;
          if (top <= readingLine) {
            // 打开分享链接时，原生锚点定位本身不覆盖上次的位置。
            if (top < 0 || window.location.hash !== '#' + entry.id) { rememberReading(entry.id); }
            return;
          }
        }
      }

      updateResumeLink();
      resumeLink.addEventListener('click', function (event) { followJump(event, resumeLink); });
      window.addEventListener('scroll', function () {
        window.clearTimeout(readingTimer);
        readingTimer = window.setTimeout(function () {
          readingTimer = null;
          recordVisibleHeading();
        }, 180);
      }, { passive: true });
      window.addEventListener('pagehide', function () {
        if (readingTimer === null) { return; }
        window.clearTimeout(readingTimer);
        readingTimer = null;
        recordVisibleHeading();
      });

      // ---- 复制小节链接：浏览器禁止剪贴板时提供可选择的地址 ----
      var copyDialog = document.getElementById('copy-dialog');
      var copyInput = document.getElementById('copy-url');
      var copyLocalNote = document.getElementById('copy-local-note');
      var copyStatus = document.getElementById('copy-status');

      readingHeadings.forEach(function (entry) {
        var button = document.createElement('button');
        button.className = 'copy-link';
        button.type = 'button';
        button.textContent = '复制链接';
        button.setAttribute('aria-label', '复制「' + entry.title + '」的链接');
        entry.node.setAttribute('aria-label', entry.title);
        entry.node.appendChild(button);
        var feedbackTimer;
        button.addEventListener('click', async function () {
          var url = new URL(window.location.href);
          url.hash = entry.id;
          try {
            await navigator.clipboard.writeText(url.href);
            button.textContent = '已复制';
            copyStatus.textContent = '已复制「' + entry.title + '」的链接';
            window.clearTimeout(feedbackTimer);
            feedbackTimer = window.setTimeout(function () { button.textContent = '复制链接'; }, 1500);
          } catch (error) {
            copyInput.value = url.href;
            copyLocalNote.hidden = url.protocol !== 'file:';
            if (!copyDialog.open) { copyDialog.showModal(); }
            copyInput.select();
          }
        });
      });

      function clearResults() {
        results.textContent = '';
        results.hidden = true;
        searchStatus.textContent = '';
        toc.classList.remove('is-searching');
      }

      function resetSearch() {
        searchInput.value = '';
        clearResults();
      }

      function buildResult(match, length) {
        var item = match.item;
        var position = match.position;
        var link = document.createElement('a');
        link.href = '#' + item.id;
        var chapter = document.createElement('span');
        chapter.className = 'toc-result-chapter';
        chapter.textContent = item.title;
        link.appendChild(chapter);
        var snippet = document.createElement('span');
        snippet.className = 'toc-result-text';
        var start = Math.max(0, position - 16);
        var end = Math.min(item.text.length, position + length + 28);
        if (start > 0) { snippet.appendChild(document.createTextNode('…')); }
        snippet.appendChild(document.createTextNode(item.text.slice(start, position)));
        var mark = document.createElement('mark');
        mark.textContent = item.text.slice(position, position + length);
        snippet.appendChild(mark);
        snippet.appendChild(document.createTextNode(item.text.slice(position + length, end)));
        if (end < item.text.length) { snippet.appendChild(document.createTextNode('…')); }
        link.appendChild(snippet);
        link.addEventListener('click', function (event) {
          followJump(event, link, function () {
            resetSearch();
            if (narrow.matches) { showDirectory(false); }
          });
        });
        return link;
      }

      function showResults(query) {
        var needle = query.toLowerCase();
        var best = Object.create(null);
        results.textContent = '';
        searchIndex.forEach(function (item, index) {
          var position = item.normalized.indexOf(needle);
          if (position < 0) { return; }
          var rank = item.heading ? (item.normalized === needle ? 3 : 2) : 1;
          if (!best[item.id] || rank > best[item.id].rank) {
            best[item.id] = { item: item, index: index, position: position, rank: rank };
          }
        });
        var matches = Object.keys(best).map(function (id) { return best[id]; });
        matches.sort(function (a, b) { return b.rank - a.rank || a.index - b.index; });
        var limit = 12;
        var summary = matches.length ? '找到 ' + matches.length + ' 处匹配' : '没有匹配的内容';
        if (matches.length > limit) { summary += '，显示前 ' + limit + ' 处'; }
        var message = document.createElement('p');
        message.className = 'toc-empty';
        message.setAttribute('aria-hidden', 'true');
        message.textContent = summary;
        results.appendChild(message);
        matches.slice(0, limit).forEach(function (match) {
          results.appendChild(buildResult(match, needle.length));
        });
        results.hidden = false;
        results.scrollTop = 0;
        searchStatus.textContent = summary;
        toc.classList.add('is-searching');
      }

      function refreshSearch() {
        var value = cleanText(searchInput.value);
        if (value) { showResults(value); } else { clearResults(); }
      }
      var composing = false;
      searchInput.parentElement.hidden = false;
      searchInput.addEventListener('compositionstart', function () { composing = true; });
      searchInput.addEventListener('compositionend', function () { composing = false; refreshSearch(); });
      searchInput.addEventListener('input', function (event) {
        if (!composing && !event.isComposing) { refreshSearch(); }
      });
      toc.addEventListener('keydown', function (event) {
        if (composing || event.isComposing || event.keyCode === 229) { return; }
        if (event.key === 'Escape' && !results.hidden) {
          event.preventDefault();
          resetSearch();
          searchInput.focus();
        } else if (event.target === searchInput && (event.key === 'Enter' || event.key === 'ArrowDown')) {
          var first = results.querySelector('a');
          if (!first) { return; }
          event.preventDefault();
          if (event.key === 'Enter') { first.click(); } else { first.focus(); }
        }
      });

      // ---- 回顶按钮与表格横向溢出提示 ----
      var toTop = document.querySelector('.to-top');
      function updateReturnLink() {
        var label = narrow.matches ? '目录与搜索' : '回到正文顶部';
        toTop.setAttribute('href', narrow.matches ? '#manual-toc' : '#main');
        toTop.textContent = label;
        toTop.setAttribute('aria-label', label);
      }
      updateReturnLink();
      narrow.addEventListener('change', updateReturnLink);
      function onScroll() {
        if (!toTop) { return; }
        toTop.classList.toggle('is-visible', window.scrollY > 640);
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();

      var scrollers = Array.prototype.slice.call(document.querySelectorAll('.table-scroll'));
      function updateScroller(box) {
        var overflow = box.scrollWidth - box.clientWidth;
        var atEnd = overflow <= 4 || box.scrollLeft >= overflow - 4;
        box.classList.toggle('is-scrollable', overflow > 4);
        box.classList.toggle('is-at-end', atEnd);
      }
      scrollers.forEach(function (box) {
        updateScroller(box);
        box.addEventListener('scroll', function () { updateScroller(box); }, { passive: true });
      });
      window.addEventListener('resize', function () {
        scrollers.forEach(updateScroller);
      }, { passive: true });
    })();
  </script>
</body>
</html>
