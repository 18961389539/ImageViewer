<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ImageViewer 图像、ROI、分析和 3D/MPR 浏览使用手册。">
  <meta name="color-scheme" content="light dark">
  <title>ImageViewer 使用手册</title>
  <style>
    :root {
      color-scheme: light dark;
      --ink: #16262f;
      --ink-soft: #2f414c;
      --muted: #5c6f7b;
      --paper: #f6f8f7;
      --surface: #ffffff;
      --surface-sunken: #f1f5f4;
      --th-bg: #e9f1ef;
      --zebra: rgba(11, 122, 116, 0.055);
      --meta-ink: #4f6572;
      --line: #dbe3e6;
      --line-strong: #c3d0d6;
      --teal: #0b7a74;
      --teal-dark: #055c58;
      --link: #055c58;
      --gold: #c1861d;
      --soft-teal: #e6f3f1;
      --soft-gold: #fbf2dd;
      --code: #101e27;
      --code-ink: #dff0ee;
      --shadow: 0 18px 40px rgba(16, 33, 43, 0.09);
      --radius: 10px;
    }

    /* 跟随系统，但手动选过浅色时以手动为准 */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --ink: #dbe7ed;
        --ink-soft: #bccfd8;
        --muted: #8ba1ad;
        --paper: #0d161c;
        --surface: #14212a;
        --surface-sunken: #111c23;
        --th-bg: #1e2f39;
        --zebra: rgba(255, 255, 255, 0.055);
        --meta-ink: #9db3bf;
        --line: #24343d;
        --line-strong: #33474f;
        --teal: #4fbdb4;
        --teal-dark: #6fd0c7;
        --link: #6fd0c7;
        --gold: #d9a441;
        --soft-teal: rgba(79, 189, 180, 0.14);
        --soft-gold: rgba(217, 164, 65, 0.14);
        --code: #081117;
        --code-ink: #d7e9e6;
        --shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      }
    }

    :root[data-theme="dark"] {
        --ink: #dbe7ed;
        --ink-soft: #bccfd8;
        --muted: #8ba1ad;
        --paper: #0d161c;
        --surface: #14212a;
        --surface-sunken: #111c23;
        --th-bg: #1e2f39;
        --zebra: rgba(255, 255, 255, 0.055);
        --meta-ink: #9db3bf;
        --line: #24343d;
        --line-strong: #33474f;
        --teal: #4fbdb4;
        --teal-dark: #6fd0c7;
        --link: #6fd0c7;
        --gold: #d9a441;
        --soft-teal: rgba(79, 189, 180, 0.14);
        --soft-gold: rgba(217, 164, 65, 0.14);
        --code: #081117;
        --code-ink: #d7e9e6;
        --shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    html {
      font-size: calc(16px * var(--scale, 1));
      scroll-behavior: smooth;
      scroll-padding-top: 20px;
      -webkit-text-size-adjust: 100%;
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }

    body {
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image:
        linear-gradient(90deg, rgba(11, 122, 116, 0.045) 1px, transparent 1px) 0 0 / 26px 26px;
      font-family: "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", sans-serif;
      font-size: 1rem;
      line-height: 1.75;
      text-rendering: optimizeLegibility;
    }

    @media (prefers-color-scheme: dark) {
      body { background-image: none; }
    }

    ::selection { background: rgba(11, 122, 116, 0.22); }

    a {
      color: var(--link);
      text-decoration-color: color-mix(in srgb, var(--link) 40%, transparent);
      text-underline-offset: 0.18em;
    }

    a:hover { text-decoration-color: var(--link); }

    :focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 2px;
      border-radius: 3px;
    }

    .skip-link {
      position: absolute;
      top: -100px;
      left: 16px;
      z-index: 20;
      padding: 10px 16px;
      color: #fff;
      background: var(--teal-dark);
      border-radius: 0 0 6px 6px;
      text-decoration: none;
      transition: top 0.15s ease-in-out;
    }

    .skip-link:focus { top: 0; }

    code, kbd, pre {
      font-family: Consolas, "Cascadia Mono", "Cascadia Code", ui-monospace, monospace;
    }

    code {
      padding: 0.06em 0.34em;
      color: var(--ink-soft);
      background: color-mix(in srgb, var(--teal) 9%, transparent);
      border: 1px solid color-mix(in srgb, var(--teal) 16%, transparent);
      border-radius: 4px;
      font-size: 0.88em;
      white-space: nowrap;
    }

    kbd {
      display: inline-block;
      min-width: 1.7em;
      margin: 0 0.06em;
      padding: 0.1em 0.42em;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-bottom-width: 2px;
      border-radius: 4px;
      box-shadow: 0 1px 0 rgba(16, 33, 43, 0.06);
      font-size: 0.82em;
      line-height: 1.6;
      text-align: center;
      white-space: nowrap;
    }

    .page-header {
      position: relative;
      color: #f6fdfd;
      background:
        radial-gradient(1200px 240px at 12% -40%, rgba(79, 189, 180, 0.28), transparent 70%),
        linear-gradient(180deg, #12222b, #0e1b23 62%, #0d1920);
      border-bottom: 3px solid var(--gold);
    }

    .header-inner, .layout {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }

    .header-inner { padding: 52px 0 42px; }

    .eyebrow {
      margin: 0 0 10px;
      color: #85d5cc;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1, h2, h3 { line-height: 1.28; text-wrap: balance; }

    h1 {
      max-width: 780px;
      margin: 0;
      font-size: clamp(2rem, 3.6vw, 3.05rem);
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .subtitle {
      max-width: 660px;
      margin: 14px 0 0;
      color: #b9cdd6;
      font-size: 1.02rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr);
      gap: 48px;
      align-items: start;
      padding: 36px 0 64px;
    }

    .toc {
      position: sticky;
      top: 18px;
      max-height: calc(100vh - 36px);
      padding: 14px 12px;
      overflow: auto;
      background: color-mix(in srgb, var(--surface) 86%, transparent);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 1px 0 rgba(16, 33, 43, 0.03);
      backdrop-filter: blur(6px);
      scrollbar-width: thin;
    }

    .toc-title {
      margin: 2px 0 10px;
      padding-left: 8px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .toc a {
      display: flex;
      gap: 8px;
      align-items: baseline;
      padding: 6px 8px;
      color: var(--muted);
      border-left: 2px solid transparent;
      border-radius: 0 5px 5px 0;
      font-size: 0.9rem;
      text-decoration: none;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .toc a:hover, .toc a:focus-visible {
      color: var(--teal-dark);
      background: var(--soft-teal);
      outline: none;
    }

    .toc a[aria-current="true"] {
      color: var(--teal-dark);
      background: var(--soft-teal);
      border-left-color: var(--gold);
      font-weight: 600;
    }

    .toc-num {
      flex: none;
      color: var(--muted);
      font-size: 0.72rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      opacity: 0.75;
    }

    .toc a[aria-current="true"] .toc-num { color: var(--teal-dark); opacity: 1; }

    /* 子目录默认收起：33 项全展开时侧栏装不下。悬停某章或滚动到该章才展开，
       :has 让"当前章节"自动展开，不需要 JS。 */
    .toc-sub {
      display: none;
      margin: 0 0 6px;
      padding: 0;
      list-style: none;
    }

    .toc-group:hover .toc-sub,
    .toc-group:has(a[aria-current="true"]) .toc-sub { display: block; }

    .toc-sub a {
      padding: 3px 8px 3px 34px;
      color: var(--muted);
      border-left: 2px solid transparent;
      font-size: 0.84rem;
      line-height: 1.5;
    }

    .toc-sub a:hover, .toc-sub a:focus-visible {
      color: var(--teal-dark);
      background: var(--soft-teal);
    }

    main { min-width: 0; }

    section {
      padding: 4px 0 38px;
      border-bottom: 1px solid var(--line);
    }

    section + section { padding-top: 34px; }

    section:last-child { border-bottom: 0; }

    h2 {
      position: relative;
      margin: 0 0 16px;
      padding-left: 14px;
      font-size: 1.52rem;
      font-weight: 700;
      letter-spacing: -0.005em;
    }

    h2::before {
      position: absolute;
      top: 0.16em;
      bottom: 0.16em;
      left: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--teal), color-mix(in srgb, var(--teal) 30%, transparent));
      border-radius: 2px;
      content: "";
    }

    h3 {
      margin: 30px 0 10px;
      padding-bottom: 6px;
      color: var(--ink);
      border-bottom: 1px dashed var(--line);
      font-size: 1.08rem;
      font-weight: 650;
    }

    .anchor {
      position: absolute;
      left: -0.72em;
      padding: 0 0.16em;
      color: var(--muted);
      font-weight: 400;
      text-decoration: none;
      opacity: 0;
      transition: opacity 0.12s ease;
    }

    h2:hover .anchor, .anchor:focus-visible { opacity: 1; }

    p, ul, ol { max-width: 74ch; }

    p { margin: 0 0 14px; }

    ol, ul { margin: 0 0 16px; padding-left: 1.45rem; }

    li + li { margin-top: 5px; }

    li::marker { color: var(--muted); }

    li > code { white-space: nowrap; }

    .meta {
      display: grid;
      gap: 4px;
      margin: 0 0 28px;
      padding: 14px 18px;
      color: var(--meta-ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 3px solid var(--gold);
      border-radius: 0 var(--radius) var(--radius) 0;
      font-size: 0.92rem;
      line-height: 1.65;
    }

    .meta-line { display: block; }

    .meta code { background: color-mix(in srgb, var(--teal) 7%, transparent); }

    .step-list { counter-reset: step; max-width: 74ch; padding: 0; list-style: none; }

    .step-list > li {
      position: relative;
      min-height: 40px;
      padding: 4px 0 8px 50px;
    }

    .step-list > li + li { margin-top: 4px; }

    .step-list > li::before {
      position: absolute;
      top: 3px;
      left: 0;
      width: 30px;
      height: 30px;
      color: var(--teal-dark);
      background: var(--soft-teal);
      border: 1px solid color-mix(in srgb, var(--teal) 30%, transparent);
      border-radius: 50%;
      content: counter(step);
      counter-increment: step;
      font-size: 0.86rem;
      font-weight: 700;
      line-height: 29px;
      text-align: center;
    }

    .table-scroll {
      max-width: 100%;
      margin: 18px 0 20px;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      scrollbar-width: thin;
    }

    .table-scroll:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.94rem;
      line-height: 1.62;
      font-variant-numeric: tabular-nums;
    }

    .table-scroll table { min-width: 420px; }
    .table-scroll table.wide { min-width: 700px; }

    /* 按列数分配首列宽度：两列表是"名称 / 说明"，三列表是"分类 / 命令 / 说明"。
       Chinese: 用 :has 判断列数，避免在 Markdown 里写宽度；四列及以上保持自动分配。 */
    table:has(> thead > tr > th:nth-child(2):last-child) > thead th:nth-child(1) { width: 26%; }
    table:has(> thead > tr > th:nth-child(3):last-child) > thead th:nth-child(1) { width: 20%; }
    table:has(> thead > tr > th:nth-child(3):last-child) > thead th:nth-child(2) { width: 34%; }

    /* 只有真正溢出时才在右侧做渐隐，提示还能横向滑；滚到末尾撤掉，避免内容被永久冲淡。 */
    .table-scroll.is-scrollable:not(.is-at-end) {
      mask-image: linear-gradient(90deg, #000 calc(100% - 26px), transparent);
    }

    .chapter-index {
      margin: 34px 0 0;
      padding: 18px 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .chapter-index-title {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .chapter-index ol {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 3px 28px;
      margin: 0;
      padding-left: 0;
      max-width: none;
      counter-reset: chapter;
      list-style: none;
      font-size: 0.93rem;
    }

    .chapter-index li {
      display: flex;
      gap: 7px;
      align-items: baseline;
      counter-increment: chapter;
    }

    .chapter-index li::before {
      flex: none;
      min-width: 1.7em;
      color: var(--muted);
      content: counter(chapter, decimal-leading-zero);
      font-size: 0.76rem;
      font-variant-numeric: tabular-nums;
      opacity: 0.8;
    }

    .chapter-index a { text-decoration: none; }

    .chapter-index a:hover { text-decoration: underline; }

    th, td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      position: relative;
      color: var(--ink);
      background: var(--th-bg);
      border-bottom: 1px solid var(--line-strong);
      font-size: 0.86rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    th code {
      background: var(--surface);
      border-color: var(--line-strong);
      font-weight: 600;
    }

    tbody tr:nth-child(even) { background: var(--zebra); }

    tbody tr:hover { background: var(--soft-teal); }

    tbody tr:last-child td { border-bottom: 0; }

    td:first-child { color: var(--ink); }

    td code { white-space: nowrap; }

    figure {
      margin: 20px 0 22px;
    }

    /* 原尺寸显示、超宽才缩：小图（面板、状态栏）不该被放大成马赛克。 */
    figure img {
      display: block;
      width: auto;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    figcaption {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.55;
    }

    pre {
      position: relative;
      margin: 18px 0 20px;
      padding: 34px 18px 16px;
      overflow-x: auto;
      color: var(--code-ink);
      background: var(--code);
      border-radius: var(--radius);
      line-height: 1.6;
      tab-size: 4;
    }

    pre[data-lang]::before {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      padding: 7px 16px;
      color: #8fb3ae;
      background: rgba(255, 255, 255, 0.055);
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      content: attr(data-lang);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    pre code {
      padding: 0;
      color: inherit;
      background: none;
      border: 0;
      font-size: 0.9rem;
      white-space: pre;
    }

    .toc-search { margin-bottom: 10px; }

    .toc-search input {
      width: 100%;
      padding: 7px 10px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      font: inherit;
      font-size: 0.88rem;
    }

    .toc-search input::placeholder { color: var(--muted); }

    .toc-search input:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }

    .toc.is-searching .toc-title,
    .toc.is-searching .toc-group,
    .toc.is-searching .toc-nav { display: none; }

    #toc-results { display: grid; gap: 2px; }

    #toc-results a {
      display: block;
      padding: 7px 8px;
      border-left: 0;
      border-radius: 6px;
      text-decoration: none;
    }

    #toc-results a:hover { background: var(--soft-teal); }

    .toc-result-chapter {
      display: block;
      color: var(--teal-dark);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
    }

    .toc-result-text {
      display: block;
      margin-top: 2px;
      color: var(--ink-soft);
      font-size: 0.84rem;
      line-height: 1.5;
    }

    #toc-results mark {
      padding: 0 0.12em;
      color: inherit;
      background: color-mix(in srgb, var(--gold) 34%, transparent);
      border-radius: 2px;
      box-shadow: inset 0 -0.3em 0 color-mix(in srgb, var(--gold) 20%, transparent);
    }

    .toc-empty { margin: 6px 8px; color: var(--muted); font-size: 0.85rem; }

    .toc-nav {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .toc-nav a {
      padding: 4px 6px;
      color: var(--muted);
      border-left: 0;
      border-radius: 5px;
      font-size: 0.82rem;
      text-decoration: none;
    }

    .toc-nav a:hover { color: var(--teal-dark); background: var(--soft-teal); }

    .toc-nav a[aria-disabled="true"] { opacity: 0.4; pointer-events: none; }

    .reader-tools {
      position: fixed;
      right: 22px;
      bottom: 74px;
      z-index: 10;
      display: grid;
      gap: 6px;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      box-shadow: var(--shadow);
    }

    .reader-tools button {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      padding: 0;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-radius: 50%;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .reader-tools button:hover { color: var(--teal-dark); background: var(--soft-teal); }

    .to-top {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 14px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      box-shadow: var(--shadow);
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .to-top.is-visible { opacity: 1; pointer-events: auto; transform: none; }

    .to-top:hover { border-color: var(--teal); color: var(--teal-dark); }

    @media (prefers-color-scheme: dark) {
      pre { border: 1px solid rgba(255, 255, 255, 0.07); }
    }

    .footer {
      padding: 26px 0 44px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      font-size: 0.86rem;
      text-align: center;
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; gap: 20px; padding-top: 22px; }
      .toc {
        position: static;
        display: flex;
        gap: 2px;
        align-items: center;
        max-height: none;
        padding: 8px 10px;
        overflow-x: auto;
        flex-wrap: nowrap;
      }
      .toc-title { margin: 0 6px 0 0; flex: none; }
      .toc a { flex: none; border-left: 0; border-bottom: 2px solid transparent; border-radius: 5px 5px 0 0; }
      .toc a[aria-current="true"] { border-left: 0; border-bottom-color: var(--gold); }
      .toc-num, .toc-sub { display: none; }
      section + section { padding-top: 28px; }
      p, ul, ol, .step-list { max-width: none; }
      .chapter-index ol { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      .header-inner, .layout { width: 100%; padding-right: 14px; padding-left: 14px; }
      .header-inner { padding-top: 36px; padding-bottom: 28px; }
      h1 { font-size: 1.72rem; overflow-wrap: anywhere; }
      h2 { font-size: 1.3rem; }
      th, td { padding: 9px 10px; }
      /* 390 宽的屏幕上再保留 420px 最小宽度就会把整页撑出横向滚动 */
      .table-scroll table, .table-scroll table.wide { min-width: 0; }
      .to-top { right: 14px; bottom: 14px; }
      .reader-tools { right: 14px; bottom: 66px; }
    }

    @media print {
      /* 打印必须强制浅色：系统处于暗色模式时，深色变量会一路带进纸张，
         表头会变成深底黑字。这里把屏幕用的每个颜色变量都重置一遍。 */
      :root {
        --ink: #16262f;
        --ink-soft: #2f414c;
        --muted: #5c6f7b;
        --meta-ink: #4f6572;
        --paper: #fff;
        --surface: #fff;
        --surface-sunken: #f5f7f6;
        --th-bg: #edf3f1;
        --zebra: #f7faf9;
        --line: #d3dade;
        --line-strong: #b9c7ce;
        --link: #055c58;
        --teal: #0b7a74;
        --teal-dark: #055c58;
        --soft-teal: #eef7f5;
        --soft-gold: #fbf2dd;
        --code-ink: #16262f;
      }
      @page { size: A4; margin: 14mm 12mm; }
      body { background: #fff; font-size: 10.5pt; }
      .page-header { color: #16262f; background: #fff; border-bottom: 2px solid var(--gold); }
      .eyebrow { color: var(--teal-dark); }
      .subtitle { color: var(--muted); }
      .header-inner { padding: 0 0 14px; }
      .layout { display: block; width: auto; padding: 14px 0 0; }
      .skip-link, .to-top, .reader-tools, .toc-search { display: none; }
      .toc-nav { display: none; }
      /* 打印件也要目录：独立一页，排在正文之前 */
      .toc {
        position: static;
        display: block;
        max-height: none;
        padding: 0 0 8px;
        overflow: visible;
        background: none;
        border: 0;
        box-shadow: none;
        line-height: 1.3;
        break-after: page;
      }
      .toc a {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 2px 0;
        color: #16262f;
        border: 0;
      }
      .toc-sub { display: block; margin: 0 0 4px; }
      .toc-sub a { padding: 1px 0 1px 40px; color: #5c6f7b; font-size: 9.5pt; }
      figure { break-inside: avoid; margin: 10px 0; }
      .toc a[aria-current="true"] { font-weight: 600; }
      .toc-title { margin: 0 0 10px; color: #5c6f7b; font-size: 0.78rem; }
      /* A4 宽度同样命中 max-width:900px 的窄屏规则，那里会隐藏编号、把目录压成横条；
         打印必须显式恢复，否则纸质目录没有序号。 */
      .toc-num { display: inline; flex: none; min-width: 2em; color: #5c6f7b; }
      .toc a { border-bottom: 0; }
      h1 { font-size: 22pt; }
      .subtitle { margin-top: 8px; font-size: 10pt; }
      /* 纸质件已有完整目录，正文末尾的卡片只是屏幕导航，打印时去掉 */
      .chapter-index, .footer { display: none; }
      section { padding-bottom: 16px; }
      section + section { padding-top: 18px; }
      .table-scroll { overflow: visible; border-radius: 0; }
      .table-scroll table, .table-scroll table.wide { min-width: 0; }
      table { font-size: 9pt; overflow-wrap: anywhere; }
      thead { display: table-header-group; }
      tr, pre { break-inside: avoid; }
      h2, h3 { break-after: avoid; }
      pre { white-space: pre-wrap; background: #f5f7f6; color: #16262f; border: 1px solid var(--line); }
      pre[data-lang]::before { display: none; }
      pre code { color: inherit; }
      a { color: inherit; text-decoration: none; }
      .anchor { display: none; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>

  <header class="page-header">
    <div class="header-inner">
      <p class="eyebrow">ImageViewer / User Guide</p>
      <h1>ImageViewer 使用手册</h1>
      <p class="subtitle">从第一次标定和导出开始，逐步掌握图像浏览、ROI 测量、体数据与项目交付。</p>
    </div>
  </header>

  <div class="layout">
    <nav class="toc" aria-label="手册目录">
      <div class="toc-search">
        <input id="toc-search" type="search" placeholder="搜索手册…" aria-label="搜索手册" autocomplete="off">
      </div>
      <p class="toc-title">目录</p>
<!--{{TOC}}-->
      <div id="toc-results" hidden></div>
      <div class="toc-nav">
        <a id="toc-prev" href="#">‹ 上一章</a>
        <a id="toc-next" href="#">下一章 ›</a>
      </div>
    </nav>

    <main id="main">
<!--{{CONTENT}}-->
    </main>
  </div>

  <div class="reader-tools" role="group" aria-label="阅读设置">
    <button type="button" data-action="font-smaller" aria-label="缩小字号">A−</button>
    <button type="button" data-action="font-larger" aria-label="放大字号">A+</button>
    <button type="button" data-action="toggle-theme" aria-label="切换深浅色">☾</button>
  </div>

  <a class="to-top" href="#main" aria-label="回到顶部">回到顶部</a>

  <footer class="footer">ImageViewer 使用手册 · 由 docs/usage.md 生成 · 可离线打开与打印</footer>

  <script>
    (function () {
      var root = document.documentElement;
      var links = Array.prototype.slice.call(document.querySelectorAll('.toc a[href^="#"]'));
      var byId = {};
      links.forEach(function (link) { byId[link.getAttribute('href').slice(1)] = link; });
      var sections = Array.prototype.slice.call(document.querySelectorAll('main section[id]'));

      // ---- 阅读设置：字号与深浅色（存 localStorage，file:// 下可能被禁用，故都包了 try） ----
      function readStore(key) {
        try { return window.localStorage.getItem(key); } catch (error) { return null; }
      }
      function writeStore(key, value) {
        try { window.localStorage.setItem(key, value); } catch (error) { /* 忽略 */ }
      }

      var scale = parseFloat(readStore('iv-scale') || '1');
      if (isNaN(scale)) { scale = 1; }
      function applyScale(value) {
        scale = Math.min(1.3, Math.max(0.85, Math.round(value * 100) / 100));
        root.style.setProperty('--scale', String(scale));
        writeStore('iv-scale', String(scale));
      }
      applyScale(scale);

      Array.prototype.forEach.call(document.querySelectorAll('[data-action="font-smaller"]'), function (button) {
        button.addEventListener('click', function () { applyScale(scale - 0.05); });
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-action="font-larger"]'), function (button) {
        button.addEventListener('click', function () { applyScale(scale + 0.05); });
      });

      var themeButton = document.querySelector('[data-action="toggle-theme"]');
      var storedTheme = readStore('iv-theme');
      if (storedTheme === 'dark' || storedTheme === 'light') {
        root.setAttribute('data-theme', storedTheme);
      }
      function effectiveDark() {
        var attr = root.getAttribute('data-theme');
        if (attr === 'dark') { return true; }
        if (attr === 'light') { return false; }
        return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      }
      function syncThemeButton() {
        if (!themeButton) { return; }
        var dark = effectiveDark();
        themeButton.textContent = dark ? '☀' : '☾';
        themeButton.setAttribute('aria-label', dark ? '切换到浅色' : '切换到深色');
      }
      syncThemeButton();
      if (themeButton) {
        themeButton.addEventListener('click', function () {
          var next = effectiveDark() ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          writeStore('iv-theme', next);
          syncThemeButton();
        });
      }

      // ---- 目录高亮与上一章/下一章 ----
      var current = null;
      var currentIndex = -1;

      function setChapterLink(link, section) {
        if (section) {
          link.setAttribute('href', '#' + section.id);
          link.removeAttribute('aria-disabled');
        } else {
          link.removeAttribute('href');
          link.setAttribute('aria-disabled', 'true');
        }
      }

      function updateChapterNav() {
        var prev = document.getElementById('toc-prev');
        var next = document.getElementById('toc-next');
        if (!prev || !next) { return; }
        setChapterLink(prev, sections[currentIndex - 1]);
        setChapterLink(next, sections[currentIndex + 1]);
      }

      function setCurrent(id) {
        if (!id || id === current) { return; }
        var index = -1;
        for (var i = 0; i < sections.length; i++) {
          if (sections[i].id === id) { index = i; break; }
        }
        if (index < 0) { return; }
        current = id;
        currentIndex = index;
        links.forEach(function (link) { link.removeAttribute('aria-current'); });
        var active = byId[id];
        if (active) {
          active.setAttribute('aria-current', 'true');
          if (active.scrollIntoView) { active.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
        }
        updateChapterNav();
      }

      if ('IntersectionObserver' in window && sections.length) {
        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) { setCurrent(entry.target.id); }
          });
        }, { rootMargin: '-84px 0px -68% 0px', threshold: 0 });
        sections.forEach(function (section) { observer.observe(section); });
      }

      setCurrent((window.location.hash || '').slice(1) || (sections[0] && sections[0].id));

      // ---- 站内搜索：标题与正文做子串匹配，命中片段带高亮 ----
      var searchInput = document.getElementById('toc-search');
      var results = document.getElementById('toc-results');
      var toc = document.querySelector('.toc');
      var searchIndex = [];

      sections.forEach(function (section) {
        var heading = section.querySelector('h2');
        var title = section.id;
        if (heading) {
          // h2 里的 "#" 是锚点链接的文字，搜索结果里不该带出来
          var headingCopy = heading.cloneNode(true);
          var headingAnchor = headingCopy.querySelector('.anchor');
          if (headingAnchor) { headingAnchor.parentNode.removeChild(headingAnchor); }
          title = headingCopy.textContent.replace(/\s+/g, ' ').trim() || section.id;
        }
        Array.prototype.forEach.call(section.querySelectorAll('h3, p, li, td, th'), function (node) {
          var text = node.textContent.replace(/\s+/g, ' ').trim();
          if (text.length >= 6) { searchIndex.push({ id: section.id, title: title, text: text }); }
        });
      });

      function clearResults() {
        if (!results) { return; }
        results.textContent = '';
        results.hidden = true;
        if (toc) { toc.classList.remove('is-searching'); }
      }

      function buildResult(item, position, length) {
        var link = document.createElement('a');
        link.href = '#' + item.id;
        var chapter = document.createElement('span');
        chapter.className = 'toc-result-chapter';
        chapter.textContent = item.title;
        link.appendChild(chapter);
        var snippet = document.createElement('span');
        snippet.className = 'toc-result-text';
        var start = Math.max(0, position - 16);
        var end = Math.min(item.text.length, position + length + 28);
        if (start > 0) { snippet.appendChild(document.createTextNode('…')); }
        snippet.appendChild(document.createTextNode(item.text.slice(start, position)));
        var mark = document.createElement('mark');
        mark.textContent = item.text.slice(position, position + length);
        snippet.appendChild(mark);
        snippet.appendChild(document.createTextNode(item.text.slice(position + length, end)));
        if (end < item.text.length) { snippet.appendChild(document.createTextNode('…')); }
        link.appendChild(snippet);
        link.addEventListener('click', function () {
          if (searchInput) { searchInput.value = ''; }
          clearResults();
        });
        return link;
      }

      function showResults(query) {
        if (!results) { return; }
        var needle = query.toLowerCase();
        var seen = {};
        var count = 0;
        results.textContent = '';
        for (var i = 0; i < searchIndex.length && count < 12; i++) {
          var item = searchIndex[i];
          var position = item.text.toLowerCase().indexOf(needle);
          if (position < 0) { continue; }
          var key = item.id + '|' + item.text.slice(0, 24);
          if (seen[key]) { continue; }
          seen[key] = 1;
          count += 1;
          results.appendChild(buildResult(item, position, needle.length));
        }
        if (count === 0) {
          var empty = document.createElement('p');
          empty.className = 'toc-empty';
          empty.textContent = '没有匹配的内容';
          results.appendChild(empty);
        }
        results.hidden = false;
        if (toc) { toc.classList.add('is-searching'); }
      }

      if (searchInput && results) {
        var timer = null;
        searchInput.addEventListener('input', function () {
          var value = searchInput.value.trim();
          window.clearTimeout(timer);
          if (!value) { clearResults(); return; }
          timer = window.setTimeout(function () { showResults(value); }, 90);
        });
        searchInput.addEventListener('keydown', function (event) {
          if (event.key === 'Escape') {
            event.stopPropagation();
            searchInput.value = '';
            clearResults();
          }
        });
      }

      // ---- 回顶按钮与表格横向溢出提示 ----
      var toTop = document.querySelector('.to-top');
      function onScroll() {
        if (!toTop) { return; }
        toTop.classList.toggle('is-visible', window.scrollY > 640);
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();

      var scrollers = Array.prototype.slice.call(document.querySelectorAll('.table-scroll'));
      function updateScroller(box) {
        var overflow = box.scrollWidth - box.clientWidth;
        var atEnd = overflow <= 4 || box.scrollLeft >= overflow - 4;
        box.classList.toggle('is-scrollable', overflow > 4);
        box.classList.toggle('is-at-end', atEnd);
      }
      scrollers.forEach(function (box) {
        updateScroller(box);
        box.addEventListener('scroll', function () { updateScroller(box); }, { passive: true });
      });
      window.addEventListener('resize', function () {
        scrollers.forEach(updateScroller);
      }, { passive: true });
    })();
  </script>
</body>
</html>
